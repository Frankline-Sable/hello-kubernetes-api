apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-hello-api
  labels:
    {{- include "hello-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: hello-api
    app.kubernetes.io/instance: {{ .Release.Name }}
