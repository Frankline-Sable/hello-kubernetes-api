replicaCount: 2

image:
  repository: hello-api
  tag: v4
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

probes:
  readiness:
    path: /health/ready
  liveness:
    path: /health/live

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi