apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: hello-api

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-api

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      target:
        type: Utilization
        averageUtilization: 80

# kubectl autoscale deployment hello-api --cpu=80% --min=2 --max=10