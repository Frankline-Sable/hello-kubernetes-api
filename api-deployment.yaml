apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: hello-api

  template:
    metadata:
      labels:
        app: hello-api

    spec:
      containers:
        - name: hello-api
          image: hello-api:v6
          imagePullPolicy: Never
          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: hello-api-config

            - secretRef:
                name: hello-api-secret

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5


          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10