apiVersion: v1
kind: Pod
metadata:
  name: database
  labels:
    app: database
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Pod
metadata:
  name: api-client
  labels:
    app: api
spec:
  containers:
    - name: client
      image: curlimages/curl
      command: ["sleep", "3600"]

---
apiVersion: v1
kind: Pod
metadata:
  name: admin-client
  labels:
    app: admin
spec:
  containers:
    - name: client
      image: curlimages/curl
      command: ["sleep", "3600"]

---
apiVersion: v1
kind: Service
metadata:
  name: database-service
spec:
  selector:
    app: database
  ports:
    - port: 80
      targetPort: 80