apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60

      template:
        spec:
          restartPolicy: Never

          containers:
            - name: worker
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  echo "CronJob started at $(date)"
                  sleep 10
                  echo "CronJob finished at $(date)"